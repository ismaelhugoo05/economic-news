name: Daily publish

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC every day
  workflow_dispatch:  # manual "Run workflow" button for testing

permissions: {}  # nothing by default; each job asks only for what it needs

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # RUN_LIMIT stops new reports at 10 min; this is the backstop if anything hangs
    permissions:
      contents: write  # commit new articles and seen_urls.txt back, so stories are never repeated
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved); the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Fetch stories and build site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # only this step sees the key; the code sends it in a header and never prints it
        run: python run_daily.py

      - name: Save new articles to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles data/seen_urls.txt
          git diff --cached --quiet || { git commit -m "Daily articles $(date -u +%F)" && git push; }

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # publish to GitHub Pages
      id-token: write  # required by deploy-pages to authenticate the deployment
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
